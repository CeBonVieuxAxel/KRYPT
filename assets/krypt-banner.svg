<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="68%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#18181B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#060607" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="orbGlass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#71717A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Fond noir carbone -->
  <rect width="1280" height="640" fill="#060607"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>

  <!-- Ondes topographiques subtiles -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.2">
    <path d="M-50 420 Q 320 330, 640 430 T 1330 390"/>
    <path d="M-50 450 Q 320 360, 640 460 T 1330 420"/>
    <path d="M-50 480 Q 320 390, 640 490 T 1330 450"/>
    <path d="M-50 510 Q 320 420, 640 520 T 1330 480"/>
    <path d="M-50 540 Q 320 450, 640 550 T 1330 510"/>
  </g>

  <!-- Badges haut -->
  <g font-family="monospace" font-size="13" fill="#A1A1AA">
    <rect x="44" y="34" width="110" height="28" rx="14" fill="#121215" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="99" y="52" text-anchor="middle">v1.0.0-beta</text>

    <rect x="1116" y="34" width="120" height="28" rx="14" fill="#121215" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="1176" y="52" text-anchor="middle">Windows 10/11</text>
  </g>

  <!-- Typographie gauche : KRYPT -->
  <text x="76" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="88" font-weight="600" letter-spacing="22" fill="#FFFFFF">KRYPT</text>
  <text x="80" y="285" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="300" letter-spacing="1" fill="#A1A1AA">Vos secrets, sans le bruit.</text>

  <!-- Badges techniques discrets -->
  <g font-family="monospace" font-size="13" fill="#D4D4D8">
    <rect x="80" y="330" width="136" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="148" y="350" text-anchor="middle">AES-256-GCM</text>

    <rect x="228" y="330" width="118" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="287" y="350" text-anchor="middle">Argon2id</text>

    <rect x="358" y="330" width="124" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="420" y="350" text-anchor="middle">100% Local</text>
  </g>

  <!-- Fenêtre Coffre-Fort en perspective à droite -->
  <g transform="translate(565, 118) skewY(-5)">
    <rect x="0" y="0" width="630" height="410" rx="20" fill="#0A0A0D" stroke="url(#cardEdge)" stroke-width="2"/>
    <!-- Sidebar du coffre -->
    <rect x="0" y="0" width="175" height="410" rx="20" fill="#0E0E12"/>
    <line x1="175" y1="0" x2="175" y2="410" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Logo KRYPT dans la sidebar -->
    <circle cx="32" cy="34" r="10" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M29 29V39M35 29L30 34L35 39" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="52" y="39" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#FFFFFF">KRYPT</text>

    <!-- Pilule active sidebar -->
    <rect x="14" y="72" width="147" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="32" y="93" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF">Tous les secrets</text>
    <text x="32" y="132" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Identifiants</text>
    <text x="32" y="166" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Cartes &amp; IBAN</text>
    <text x="32" y="200" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Générateur</text>

    <!-- Cartes d'identifiants chiffrés à droite -->
    <rect x="200" y="26" width="404" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="220" y="49" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Rechercher dans le coffre... (Ctrl+F)</text>

    <rect x="200" y="84" width="404" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="232" cy="116" r="14" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="232" y="121" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFFFFF">GH</text>
    <text x="260" y="111" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">GitHub — CeBonVieuxAxel</text>
    <text x="260" y="129" font-family="monospace" font-size="11" fill="#A1A1AA">••••••••••••••••••••</text>

    <rect x="200" y="162" width="404" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="232" cy="194" r="14" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="232" y="199" text-anchor="middle" font-family="monospace" font-size="12" fill="#D4D4D8">AZ</text>
    <text x="260" y="189" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#E4E4E7">Azot Sync Key</text>
    <text x="260" y="207" font-family="monospace" font-size="11" fill="#71717A">••••••••••••••••</text>

    <rect x="200" y="240" width="404" height="64" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="232" cy="272" r="14" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="232" y="277" text-anchor="middle" font-family="monospace" font-size="12" fill="#D4D4D8">PR</text>
    <text x="260" y="267" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#E4E4E7">Proton Mail</text>
    <text x="260" y="285" font-family="monospace" font-size="11" fill="#71717A">••••••••••••••••••</text>
  </g>

  <!-- Sphères / Atomes 3D verre fumé autour du coffre -->
  <circle cx="555" cy="165" r="34" fill="url(#orbGlass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
  <circle cx="1175" cy="135" r="46" fill="url(#orbGlass)" stroke="#FFFFFF" stroke-opacity="0.20"/>
  <circle cx="1195" cy="445" r="38" fill="url(#orbGlass)" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <circle cx="675" cy="548" r="24" fill="url(#orbGlass)" stroke="#FFFFFF" stroke-opacity="0.25"/>

  <!-- Footer bannière -->
  <text x="44" y="606" font-family="monospace" font-size="12" fill="#71717A">Axel LEFEBVRE • Écosystème Azot</text>
  <text x="1236" y="606" text-anchor="end" font-family="monospace" font-size="12" fill="#A1A1AA">Zero Cloud. Zero Bloat. Local Vault.</text>
</svg>
