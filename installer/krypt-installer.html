<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>KRYPT — Installation</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050506;color:#f4f4f6;font:13px Segoe UI,sans-serif}.bar{height:36px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;-webkit-app-region:drag;color:#8a8a93;letter-spacing:.18em;font-size:10px}.bar div{-webkit-app-region:no-drag}.bar button{width:28px;height:24px;border:0;border-radius:6px;background:transparent;color:#aaa}.bar button:hover{background:#ffffff14;color:#fff}.container{height:524px;padding:18px 36px 28px;display:flex;justify-content:center;align-items:center}.main{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}.logo{width:62px;height:62px;padding:15px;border-radius:50%;background:#ffffff0a;border:1px solid #ffffff18;flex-shrink:0}.logo img{width:100%;height:100%}h1{font-size:25px;letter-spacing:.32em;padding-left:.32em;margin:13px 0 3px}.version{color:#8a8a93;margin-bottom:18px}.card{width:100%;padding:18px;text-align:left;background:#ffffff0b;border:1px solid #ffffff19;border-radius:16px}.card label{display:block;color:#aaa;font-size:11px;margin-bottom:7px}.path{display:flex;gap:8px;margin-bottom:14px}.path input{flex:1;min-width:0;padding:0 10px;color:#eee;background:#0008;border:1px solid #ffffff1a;border-radius:10px}.ghost,.primary{border:0;border-radius:10px;padding:10px 12px}.ghost{color:#eee;background:#ffffff0d;border:1px solid #ffffff19}.options{display:grid;gap:9px;margin-bottom:16px}.options label{display:flex;align-items:center;justify-content:space-between;margin:0;color:#eee;font-size:13px}.primary{width:100%;background:#fff;color:#050506;font-weight:600}.progress,.done{display:none}.status{display:flex;justify-content:space-between;color:#aaa}.track{height:4px;margin-top:12px;border-radius:8px;background:#ffffff15;overflow:hidden}.fill{width:0;height:100%;background:#fff;transition:width .26s}.done{text-align:center}.done p{margin:0 0 14px}</style></head><body><header class="bar"><span>KRYPT</span><div><button id="min">—</button><button id="close">×</button></div></header><main class="container"><div class="main"><div class="logo"><img src="../assets/krypt-logo.svg" alt="KRYPT"></div><h1>KRYPT</h1><div class="version">v1.0.0</div><section class="card" id="setup"><label>Dossier d’installation</label><div class="path"><input id="path" readonly><button class="ghost" id="browse">Parcourir</button></div><div class="options"><label>Raccourci sur le Bureau<input id="desktop" type="checkbox" checked></label><label>Lancer au démarrage<input id="autostart" type="checkbox"></label></div><button class="primary" id="install">Installer</button></section><section class="card progress" id="progress"><div class="status"><span id="label">Extraction…</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section><section class="card done" id="done"><p>Installation terminée</p><button class="primary" id="launch">Ouvrir KRYPT</button></section></div></main><script>const $=id=>document.getElementById(id);$('path').value='C:\\Program Files\\Krypt';$('browse').onclick=async()=>{const dir=await kryptInstaller.selectDir();if(dir)$('path').value=dir};$('install').onclick=async()=>{try{$('setup').style.display='none';$('progress').style.display='block';await kryptInstaller.startInstall({installDir:$('path').value,desktopShortcut:$('desktop').checked,autoStart:$('autostart').checked});$('progress').style.display='none';$('done').style.display='block'}catch(error){$('setup').style.display='block';$('progress').style.display='none';alert(error.message)}};kryptInstaller.onProgress(({percent,label})=>{$('fill').style.width=percent+'%';$('percent').textContent=percent+'%';$('label').textContent=label});$('launch').onclick=()=>kryptInstaller.launchApp();$('min').onclick=()=>kryptInstaller.minimize();$('close').onclick=()=>kryptInstaller.close()</script></body></html>
