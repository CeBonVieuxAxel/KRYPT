<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>KRYPT — Installation</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050506;color:#f4f4f6;font:13px Segoe UI,sans-serif}.bar{height:36px;padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between;-webkit-app-region:drag;color:#898991;letter-spacing:.2em;font-size:10px}.controls{display:flex;gap:4px;-webkit-app-region:no-drag}.controls button{border:0;background:transparent;color:#aaa;width:28px;height:24px;border-radius:6px}.controls button:hover{background:#ffffff12;color:#fff}.shell{height:504px;padding:35px;display:flex;align-items:center;justify-content:center}.main{width:100%;text-align:center}.logo{width:68px;height:68px;padding:17px;border-radius:50%;border:1px solid #ffffff1a;background:#ffffff09;animation:float 6s ease-in-out infinite}.logo img{width:100%;height:100%}h1{margin:16px 0 4px;letter-spacing:.34em;padding-left:.34em;font-size:26px}.version{color:#898991;margin-bottom:25px}.card{padding:20px;text-align:left;border:1px solid #ffffff19;border-radius:16px;background:#ffffff0b;backdrop-filter:blur(24px)}label{display:block;color:#aaa;font-size:11px;margin-bottom:8px}.path{display:flex;gap:8px;margin-bottom:16px}input[type=text]{flex:1;min-width:0;background:#0008;border:1px solid #ffffff19;border-radius:10px;padding:0 10px;color:#eee}.ghost,.primary{border-radius:10px;border:1px solid #ffffff19;padding:10px 12px;color:#eee;background:#ffffff0d}.options{display:grid;gap:10px;margin-bottom:18px}.options label{display:flex;justify-content:space-between;align-items:center;margin:0;color:#eee;font-size:13px}.primary{width:100%;background:#fff;color:#050506;border:0;font-weight:600;padding:13px}.progress,.done{display:none}.track{height:4px;background:#ffffff16;border-radius:8px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#fff;transition:width .26s}.status{display:flex;justify-content:space-between;color:#aaa}@keyframes float{50%{transform:translateY(-4px)}}</style></head><body><div class="bar"><span>KRYPT</span><div class="controls"><button id="min">—</button><button id="close">×</button></div></div><main class="shell"><div class="main"><img class="logo" src="../assets/krypt-logo.svg" alt="KRYPT"><h1>KRYPT</h1><div class="version">v1.0.0</div><section class="card" id="setup"><label>Dossier d’installation</label><div class="path"><input id="path" readonly><button class="ghost" id="browse">Parcourir</button></div><div class="options"><label>Raccourci sur le Bureau<input id="desktop" type="checkbox" checked></label><label>Lancer au démarrage<input id="autostart" type="checkbox"></label></div><button class="primary" id="install">Installer</button></section><section class="card progress" id="progress"><div class="status"><span id="label">Extraction…</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section><section class="card done" id="done"><p>Installation terminée</p><button class="primary" id="launch">Ouvrir KRYPT</button></section></div></main><script>const $=id=>document.getElementById(id);$('path').value='C:\\Program Files\\Krypt';$('browse').onclick=async()=>{const dir=await kryptInstaller.selectDir();if(dir)$('path').value=dir};$('install').onclick=async()=>{try{$('setup').style.display='none';$('progress').style.display='block';await kryptInstaller.startInstall({installDir:$('path').value,desktopShortcut:$('desktop').checked,autoStart:$('autostart').checked});$('progress').style.display='none';$('done').style.display='block'}catch(error){$('setup').style.display='block';$('progress').style.display='none';alert(error.message)}};kryptInstaller.onProgress(({percent,label})=>{$('fill').style.width=percent+'%';$('percent').textContent=percent+'%';$('label').textContent=label});$('launch').onclick=()=>kryptInstaller.launchApp();$('min').onclick=()=>kryptInstaller.minimize();$('close').onclick=()=>kryptInstaller.close()</script></body></html>
