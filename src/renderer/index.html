<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KRYPT</title><link rel="stylesheet" href="style.css"><style>.hidden,[hidden]{display:none!important}</style></head><body>
<canvas id="atoms"></canvas><div class="drag titlebar"><span>KRYPT</span><div class="controls no-drag"><button data-win="minimize">—</button><button data-win="maximize">□</button><button data-win="close">×</button></div></div>
<section id="lock" class="screen"><img src="../../assets/krypt-logo.svg" class="logo" alt="KRYPT"><h1>KRYPT</h1><p>Vos secrets, sans le bruit.</p><form id="unlock-form"><input id="master" type="password" autocomplete="current-password" placeholder="Mot de passe maître" autofocus><button id="unlock-btn">Déverrouiller le coffre local</button></form><small id="lock-help">scrypt • AES-256-GCM • coffre local chiffré</small></section>
<section id="app" hidden><aside><div><div class="brand"><img src="../../assets/krypt-logo.svg" alt=""><b>KRYPT</b><button class="icon" id="lock-btn" title="Verrouiller (Ctrl+L)">⌑</button></div><nav id="nav"><button class="active" data-tab="all">Tous les secrets <i id="all-count">0</i></button><button data-tab="login">Identifiants</button><button data-tab="card">Cartes bancaires</button><button data-tab="note">Notes sécurisées</button><button data-tab="generator">Générateur</button><button data-tab="audit">Audit de sécurité</button></nav></div><div class="bottom"><label>THEME STUDIO</label><div class="themes"><button data-theme="noir" title="Azot Noir"></button><button data-theme="oled" title="OLED Pitch"></button><button data-theme="ice" title="Silver Ice"></button><button data-theme="mint" title="Obsidian Mint"></button></div><button id="export">Exporter le coffre chiffré</button><span>ZÉRO CLOUD · AES-256</span></div></aside><main><header><input id="search" placeholder="Rechercher dans le coffre… (Ctrl + F)"><button id="new-entry">+ Nouveau secret</button></header><div id="content"></div></main></section>
<dialog id="editor"><form id="editor-form"><div class="modal-title"><h2 id="editor-title">Nouveau secret</h2><button type="button" class="icon" data-close>×</button></div><input type="hidden" name="id"><label>Type<select name="type"><option value="login">Identifiant</option><option value="card">Carte bancaire</option><option value="note">Note sécurisée</option></select></label><label>Titre<input required name="title" placeholder="Ex. GitHub"></label><label>Identifiant<input name="username" placeholder="E-mail, numéro de carte…"></label><label>Mot de passe / secret<input name="password" type="text" autocomplete="off"></label><label>URL<input name="url" placeholder="https://"></label><label>Secret TOTP (optionnel)<input name="totp" placeholder="JBSWY3DPEHPK3PXP"></label><label>Notes<textarea name="notes"></textarea></label><div class="modal-actions"><button type="button" class="secondary" data-close>Annuler</button><button>Enregistrer chiffré</button></div></form></dialog><div id="toast"></div><script src="renderer.js"></script></body></html>
